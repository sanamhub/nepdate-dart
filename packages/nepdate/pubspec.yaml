name: nepdate
description: >-
  Bikram Sambat (Nepali calendar) dates for Dart and Flutter: conversion to and from
  Gregorian, arithmetic, formatting, parsing, ranges and fiscal years. Pure Dart, no
  dependencies, runs on every platform including the web.
version: 1.0.0-rc.1
repository: https://github.com/sanamhub/nepdate-dart
homepage: https://nepdate.com
issue_tracker: https://github.com/sanamhub/nepdate-dart/issues
topics:
  - nepal
  - calendar
  - bikram-sambat
  - date
  - nepali

environment:
  sdk: ^3.6.0
resolution: workspace

dev_dependencies:
  test: 1.33.0
