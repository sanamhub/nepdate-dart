name: nepdate_patro
description: >-
  The Nepali patro for Dart and Flutter: tithi, public holidays and events for every
  Bikram Sambat day from 2077 to 2084, built on the nepdate package. Pure Dart, runs on
  every platform including the web.
version: 0.2.0-rc.1
repository: https://github.com/sanamhub/nepdate-dart
homepage: https://nepdate.com
issue_tracker: https://github.com/sanamhub/nepdate-dart/issues
topics:
  - nepal
  - calendar
  - patro
  - tithi
  - nepali

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  nepdate: ^0.2.0-rc.1

dev_dependencies:
  test: 1.33.0
