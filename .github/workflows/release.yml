# One tag vX.Y.Z releases `nepdate` and `nepdate_patro` on the hub's lockstep line. A manual
# dispatch runs the gates and the publish dry run, and never publishes. Publishing needs the tag and
# the `production` environment (ADR-0007).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run the gates and the publish dry run, skip publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Run every gate
        run: dart run tool/ci.dart
      - name: Read and validate the version
        id: version
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            if ! dart scripts/version.dart --check-tag "$REF_NAME"; then
              echo "the tag and the manifests disagree" >&2
              exit 1
            fi
          fi
          if ! version="$(dart scripts/version.dart)"; then
            echo "$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the manifests and the changelogs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dart scripts/release_check.dart "$VERSION"
      - name: Publish dry run, core
        working-directory: packages/nepdate
        run: dart pub publish --dry-run
      - name: Publish dry run, patro
        working-directory: packages/nepdate_patro
        run: dart pub publish --dry-run
      - name: Build the release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude=.dart_tool -czf "dist/nepdate-$VERSION.tar.gz" -C packages/nepdate .
          tar --exclude=.dart_tool -czf "dist/nepdate_patro-$VERSION.tar.gz" -C packages/nepdate_patro .
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist
      - name: Verify the checked archives
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Read the version
        id: version
        run: echo "version=$(dart scripts/version.dart)" >> "$GITHUB_OUTPUT"
      - name: Publish nepdate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS "https://pub.dev/api/packages/nepdate/versions/$VERSION" >/dev/null; then
            echo "nepdate $VERSION is already on pub.dev"
          else
            (cd packages/nepdate && dart pub publish --force)
          fi
      - name: Publish nepdate_patro
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsS "https://pub.dev/api/packages/nepdate_patro/versions/$VERSION" >/dev/null; then
            echo "nepdate_patro $VERSION is already on pub.dev"
          else
            (cd packages/nepdate_patro && dart pub publish --force)
          fi

  verify:
    needs: publish
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.publish.outputs.version }}

  github-release:
    needs: [publish, verify]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist
      - name: Verify the checked archives
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the GitHub release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          dart scripts/release_notes.dart "$VERSION" > RELEASE_NOTES.md
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "v$VERSION" dist/*.tar.gz --title "v$VERSION" \
            --notes-file RELEASE_NOTES.md --verify-tag "${prerelease[@]}"
