# Weekly: replaces shared/ with the hub's main, regenerates the tables and opens one PR on
# bot/shared-sync (hub ADR-0001 decision 3, docs/runbooks/release.md).
name: shared-sync

on:
  schedule:
    - cron: "47 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: sanamhub/nepdate/.github/workflows/shared-sync.yml@760298a4727467b41c9dd72b9a1469d361487c48 # main 2026-11-03
    with:
      regenerate: dart pub get && dart run tool/generate.dart
      dart-sdk: true
    secrets:
      SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
