version: 2
updates:
  # Keeps the pinned action SHAs current. The cooldown gives a bad release two weeks to be pulled,
  # the same rule the dev tools follow (ADR-0006). The hub workflows are pinned by commit, not by
  # tag, so they move with the shared-sync reviews instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
  # Dev tools only: neither package has a runtime dependency (ADR-0001).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
  # The benchmark harness and the selected competitor are pinned in the workspace member.
  - package-ecosystem: pub
    directory: /bench
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
