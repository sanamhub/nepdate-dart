name: nepdate_workspace
description: Workspace root for the NepDate Dart packages. Not published.
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/nepdate
  - packages/nepdate_patro
  - bench

dev_dependencies:
  coverage: 1.16.0
  lints: 6.1.0
  # 1.8.1 kills the run with SIGTERM at about 15 percent on the CI runner; 1.7.1 is
  # the version docs/mutation/floor.json was measured with.
  mutation_test: 1.7.1

# Newer releases of these transitive dev packages were under 14 days old when the lock was made.
# analyzer 14.6.0 and _fe_analyzer_shared 110.0.0 become eligible on 2026-11-03; drop the two lines
# below when the lock is next refreshed after that date.
dependency_overrides:
  analyzer: 14.5.0
  crypto: 3.0.7
  _fe_analyzer_shared: 109.0.0
  http_multi_server: 3.2.2
